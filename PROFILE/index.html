<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jay Pawar | Portfolio Card</title>
    <!-- Linking External CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Card Container -->
    <div class="card">
        
        <!-- Profile Header Section -->
        <div class="card-header">
            <!-- Profile Avatar / Image Placeholder -->
            <div class="profile-img">
                <img src="profile.jpg" alt="Jay Pawar">
            </div>
            <!-- User Name and Tagline -->
            <h1>Jay Pawar</h1>
            <p class="tagline">BCA Science Student | Web Developer</p>
        </div>

        <!-- Technical Skills Section -->
        <div class="skills-section">
            <h3>My Tech Skills</h3>
            <div class="skills">
                <span class="badge">C</span>
                <span class="badge">C++</span>
                <span class="badge">HTML5</span>
                <span class="badge">CSS3</span>
                <span class="badge">JavaScript</span>
            </div>
        </div>

        <!-- Action Buttons / Footer -->
        <div class="card-footer">
            <a href="#" class="btn primary">Connect</a>
            <a href="#" class="btn secondary">Projects</a>
        </div>

    </div>

    <!-- Linking External JS File for Future Logic -->
    <script src="script.js"></script>
</body>
</html>
